services:
  postgres:
    image: postgres:16.15
    container_name: farmacia_postgres_final
    restart: always
    environment:
      POSTGRES_USER: administrador
      POSTGRES_PASSWORD: password_seguro
      POSTGRES_DB: bd_farmacia
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # init_db.sql se ejecuta SOLO cuando el volumen db_data está vacío.
      - ./init_db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./init_db_indexes.sql:/docker-entrypoint-initdb.d/02-indexes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U administrador -d bd_farmacia"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: farmacia_pgadmin_final
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@farmacia.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  db_data:
