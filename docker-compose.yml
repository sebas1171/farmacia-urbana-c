services:
  postgres:
    image: postgres:16
    container_name: farmacia_postgres_final
    restart: always
    environment:
      POSTGRES_USER: administrador
      POSTGRES_PASSWORD: password_seguro
      POSTGRES_DB: bd_farmacia
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: farmacia_pgadmin_final
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@farmacia.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  db_data:
